# .trivyignore.yaml — accepted-risk allowlist for the release security gate.
#
# scripts/security-scan.sh reads this file (via `trivy --ignorefile`) and fails
# the release on any CRITICAL vulnerability that is NOT listed here. Anything
# listed here is dropped from the report, so this file is the only way a
# known-bad finding can ship — treat it like a signed exception list:
#
#   * every entry needs a `statement` (why it is not exploitable here, who owns
#     the fix) and an `expiredAt` date, max 90 days out;
#   * expired entries stop being honoured, so the gate starts failing again on
#     its own — that is the point;
#   * review it on every release with `git log -p .trivyignore.yaml`.
#
# Everything below is inherited from cloudron/base:6.0.1; the gate reports
# "introduced by this image: 0". Never add an entry for a finding this repo
# introduced — fix it instead.
#
# doc: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
vulnerabilities:
  # linux-libc-dev (kernel UAPI headers) — fix available upstream, clears with the next base rebuild
  - id: CVE-2026-89530
    statement: >-
      Inherited from cloudron/base:6.0.1. linux-libc-dev ships kernel UAPI headers only: no
      kernel code from it is executed by this app, and the running kernel is the Cloudron
      host's, which Cloudron patches. Ubuntu has published a fixed header package
      (7.0.0-42.42), so this clears on the next cloudron/base rebuild. Owner: Cloudron base
      image.
    expiredAt: "2027-01-31"
