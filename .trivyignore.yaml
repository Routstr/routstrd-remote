# .trivyignore.yaml — accepted-risk allowlist for the release security gate.
#
# scripts/security-scan.sh reads this file (via `trivy --ignorefile`) and fails
# the release on any CRITICAL vulnerability that is NOT listed here. Listed
# findings do not block the gate but stay visible: they appear in the full
# report (`*.full.json`), the `SOURCE=accepted` table and the accepted count.
# This file is the only way a known-bad finding can ship — treat it like a
# signed exception list:
#
#   * every entry needs a `statement` (why it is not exploitable here, who owns
#     the fix) and an `expiredAt` date, max 90 days out;
#   * expired entries stop being honoured, so the gate starts failing again on
#     its own — that is the point;
#   * the gate warns 30 and 7 days before expiry, and flags STALE acceptances
#     (ids no longer observed in the scans);
#   * review it on every release with `git log -p .trivyignore.yaml`.
#
# Everything below is inherited from cloudron/base:6.0.1; the gate reports
# "introduced by this image: 0". Never add an entry for a finding this repo
# introduced — fix it instead.
#
# doc: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
vulnerabilities:
  - id: CVE-2025-68121
    statement: >-
      Inherited from cloudron/base:6.0.1. gosu is Cloudron's privilege-drop helper, executed
      once at container start to run routstrd as the cloudron user. It parses no untrusted
      input in this app, and none of its HTTP/JSON/XML parsing paths are reachable. Fix
      requires Cloudron to rebuild gosu with Go >= 1.24.13, then adopting the new base
      digest here and rebuilding this image. Owner: Cloudron base image.
    expiredAt: "2027-01-31"
