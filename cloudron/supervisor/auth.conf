[program:auth]
priority=20
directory=/app/code
environment=HOME="/app/data",ROUTSTRD_DIR="/app/data/routstrd",ROUTSTRD_DB_PATH="/app/data/routstrd/routstr.db",ROUTSTRD_UPSTREAM="http://localhost:8009",ROUTSTRD_AUTH_HOST="0.0.0.0",ROUTSTRD_AUTH_PORT="8008"
command=/app/code/run-auth.sh
user=cloudron
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
