[program:routstrd]
priority=10
directory=/app/data
environment=HOME="/app/data",ROUTSTRD_DIR="/app/data/routstrd"
command=/usr/local/bin/bun run /usr/local/bun/install/global/node_modules/routstrd/dist/daemon/index.js --port 8009
user=cloudron
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
